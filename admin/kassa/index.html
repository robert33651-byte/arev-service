<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Arev Касса</title>
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<style>
:root{--bg:#eef2f0;--surface:#fff;--surface-2:#f6f8f7;--ink:#14211d;--muted:#5b6a65;--line:#d9e1dd;--pine:#123a33;--pine-ink:#e8f1ed;--ok:#2c8a57;--ok-soft:#e1f2e8;--warn:#b86d06;--warn-soft:#fbeedb;--bad:#c23d2c;--bad-soft:#fbe4e0}
@media (prefers-color-scheme:dark){:root{--bg:#0e1513;--surface:#162019;--surface-2:#1b2622;--ink:#e4ebe8;--muted:#94a39d;--line:#27342f;--pine:#0a2420;--pine-ink:#dcebe5;--ok:#53c085;--ok-soft:#173226;--warn:#eaa246;--warn-soft:#33260f;--bad:#ef7564;--bad-soft:#3a1d18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--pine);color:var(--pine-ink);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:17px}header .sp{flex:1}
main{max-width:1000px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
h2{margin:0 0 10px;font-size:17px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:4px;min-width:170px;flex:1}
label{font-size:13px;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0;width:100%}
input:focus,select:focus{outline:2px solid var(--pine);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:9px 14px}
button.p{background:var(--pine);color:var(--pine-ink);border-color:var(--pine);font-weight:600}
h2.hh{display:flex;align-items:center;gap:10px}.hic{width:54px;height:54px;border-radius:16px;display:inline-grid;place-items:center;flex:none}.hic img{width:40px;height:40px;display:block}.hic.o{background:#fde3e0}.hic.i{background:#dff3e2}
button img.bi{width:26px;height:26px;filter:invert(1);vertical-align:-7px;margin-right:7px}
button.out{background:#b3261e;color:#fff;border-color:#b3261e;font-weight:700}button.in{background:#2e7d32;color:#fff;border-color:#2e7d32;font-weight:700}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button.sm{padding:5px 10px;font-size:13px}button:disabled{opacity:.5;cursor:default}
header button{background:transparent;color:var(--pine-ink);border-color:rgba(255,255,255,.35)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.kpi.neg b{color:var(--bad)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--surface-2);border:1px solid var(--line)}
.c-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}.c-warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}.c-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
.recv{border:2px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.recv .amt{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.login{max-width:380px;margin:60px auto;padding:0 16px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;max-width:90vw}
.flag{padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
@media(max-width:600px){main{padding:10px}.kpi b{font-size:22px}}
.vpb{display:inline-flex;align-items:center;gap:8px;background:transparent;border:1px solid #ccc;border-radius:999px;padding:4px 14px 4px 6px;font:inherit;color:inherit;cursor:pointer}@media (prefers-color-scheme:dark){.vpi{filter:brightness(0) invert(1)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="../config.js"></script>
<script src="../hy.js"></script>
<script src="../i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';
var C=window.AREV_CONFIG||{};
var sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'arev-kassa-auth',storage:(function(){try{window.sessionStorage.setItem('_t','1');window.sessionStorage.removeItem('_t');return window.sessionStorage}catch(_){return undefined}})()}});
var DOMAIN='staff.arevservice.app';
var S={sess:null,me:null,cash:[],people:[],bal:null,purposes:[],hours:24,form:{},busy:false,flt:{who:'',per:'month',st:'',from:'',to:''},step:null,dispute:null,voidId:null,loaded:false,err:'',shifts:null,pin:null,tasks:null,last:Date.now()};
var $=function(s){return document.querySelector(s)};
var h=function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var SRV_X=['Офис','По запросу','Пополнение кассы','Приход (внёс кассир)','Куплено за свои','Куплено за свои, возврат через кассу','Тестовая корректировка остатка','Внесено задним числом','Начальный остаток','Закупка материалов','Командировка','Топливо','Заправка','Зарплата / аванс','Прочее','Инструмент'],SRV_P=['Начальный остаток на ','Возврат за покупку: ','Доп. задача: ','К запросу: ','Ожидаемый приход: '];
var srvT=function(s){if(window.ARLANG!=='hy'||s==null)return s;s=String(s);var D=window.HY_DICT||{};if(SRV_X.indexOf(s)>=0&&D[s])return D[s];for(var i=0;i<SRV_P.length;i++){var p=SRV_P[i];if(s.indexOf(p)===0&&D[p])return D[p]+s.slice(p.length)}return s};
var hu=function(x){return '<span data-noi18n>'+h(srvT(x))+'</span>'};
var puT=function(x){return window.ARLANG==='hy'&&window.HY_DICT&&window.HY_DICT[x]?window.HY_DICT[x]:x};

var money=function(n){return n==null||isNaN(n)?'—':Math.round(n).toLocaleString('ru-RU')+' ֏'};
var p2=function(n){return String(n).padStart(2,'0')};
var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
var fT=function(ts){var d=new Date(ts);return d.getDate()+' '+MON[d.getMonth()]+', '+p2(d.getHours())+':'+p2(d.getMinutes())};
var ms=function(x){return x?new Date(x).getTime():null};
var toast=function(t){document.querySelectorAll('.toast').forEach(function(x){x.remove()});var e=document.createElement('div');e.className='toast';e.textContent=window.tr?window.tr(t):t;document.body.appendChild(e);setTimeout(function(){e.remove()},3500)};
function normPhone(raw){var d=String(raw||'').replace(/\D/g,'');if(d.indexOf('00')===0)d=d.slice(2);if(d.length===9&&d[0]==='0')d='374'+d.slice(1);if(d.length===8)d='374'+d;return d}
var ERR={BACKFILL_OFF:'Ввод прошлых операций выключен',BAD_DATE:'Неверная дата',NOT_RECURRING:'Срок можно перенести только у регулярной задачи',NEED_APPROVAL:'Выдать можно только после одобрения директора',LOCKED:'Касса заблокирована: введите кассовый PIN',NO_PIN:'Сначала задайте кассовый PIN',PIN_LOCKED:'Касса заблокирована на 15 минут из-за неверных PIN',BAD_PIN_FORMAT:'PIN — от 4 до 6 цифр',PIN_WRONG:'Неверный PIN',NEED_TITLE:'Впишите название задачи',NOT_FOUND:'Запись не найдена',SHIFT_ALREADY_OPEN:'Приход уже отмечен',NO_OPEN_SHIFT:'Приход ещё не отмечен',NOT_OFFICE:'Отметка с компьютера доступна только офисным сотрудникам',BAD_AMOUNT:'Неверная сумма',NEED_PURPOSE:'Выберите цель выдачи',BAD_RECIPIENT:'Выберите получателя',NOT_CASHIER:'Нет прав кассира',NEED_NOTE:'Впишите причину',NOT_FOUND:'Запись не найдена или уже обработана',CANNOT_VOID:'Эту запись отменить нельзя',WEB_NOT_ALLOWED:'Вход с компьютера не разрешён администратором',OTHER_DEVICE:'Действие с другого устройства запрещено',NOT_APPROVED:'Анкета ещё не принята администратором',NOT_REGISTERED:'Сотрудник не найден',CASHIER_CANNOT:'Кассир запрашивает деньги через директора',REQ_CLOSED:'Запрос уже закрыт',BAD_DECISION:'Неверное решение',TASK_CLOSED:'Задача уже закрыта',PHOTO_NOT_FOUND:'Файл не загрузился, повторите',PHOTO_TOO_OLD:'Файл устарел, выберите заново',NEED_FILE:'Выберите файл',EMPTY:'Напишите текст',NOT_YOUR_TASK:'Это не ваша задача'};
function errOf(r){var m=r&&r.error?r.error.message:(r&&r.data&&r.data.error)||'';if(!m)return '';if((m==='LOCKED'||m==='NO_PIN')&&S.pin){S.pin.unlocked=false;S.pin.set=m==='LOCKED';render()}if(m==='PIN_WRONG'&&r.data&&r.data.left!=null)return 'Неверный PIN. Осталось попыток: '+r.data.left;for(var k in ERR)if(String(m).indexOf(k)>=0)return ERR[k];return 'Ошибка: '+m}
function stat(x){
  if(x.kind==='topup')return '<span class="chip c-ok">пополнение</span>';
  if(x.voided_at)return '<span class="chip">отменено</span><div class="tiny muted">'+hu((x.void_by||'')+': '+(x.void_reason||''))+'</div>';
  if(x.status==='disputed')return '<span class="chip c-bad">оспорено</span><div class="tiny" style="color:var(--bad)">'+hu(x.dispute_note||'')+'</div>';
  if(x.status==='pending'){var late=Date.now()-ms(x.at)>S.hours*36e5;return '<span class="chip '+(late?'c-bad':'c-warn')+'">ждёт подтверждения</span>'}
  return '<span class="chip c-ok">получено</span><div class="tiny muted">'+fT(ms(x.confirmed_at))+(x.confirmed_by_admin?' · подтвердил администратор':'')+'</div>'}
function dayMs(v,end){if(!/^\d{4}-\d\d-\d\d$/.test(v||''))return null;var d=new Date(v+'T00:00:00');return d.getTime()+(end?864e5:0)}
function perTo(){return S.flt.per==='range'?(dayMs(S.flt.to,true)||Infinity):Infinity}
function perFrom(p){var t=new Date();t.setHours(0,0,0,0);if(p==='range')return dayMs(S.flt.from)||0;if(p==='week')return t.getTime()-6*864e5;if(p==='month'){t.setDate(1);return t.getTime()}return 0}

async function load(){
  var u=S.sess.user.id;
  if(!S.tplGen){S.tplGen=1;try{await sb.rpc('tpl_generate')}catch(e){}}
  var q=await Promise.all([
    sb.from('staff').select('id,name,status,is_cashier,web_access,kind').eq('id',u).maybeSingle(),
    sb.from('cash_ledger').select('*').order('at',{ascending:false}).limit(2000),
    sb.from('config').select('*').eq('id',1).maybeSingle(),
    sb.from('shifts').select('id,start_at,end_at').eq('staff_id',u).order('start_at',{ascending:false}).limit(5),
    sb.from('tasks').select('id,day,due,tpl_id,due_moved_from,title,note,status,by_self,done_at,done_note,seen_at').or('staff_id.eq.'+u+',staff2_id.eq.'+u).or('status.eq.new,day.gte.'+new Date(Date.now()-7*864e5).toISOString().slice(0,10)).order('day',{ascending:true}).order('created_at',{ascending:true}).limit(200),
    sb.from('cash_requests').select('*').order('created_at',{ascending:false}).limit(500),
    sb.from('cash_expected').select('*').eq('status','open').order('created_at',{ascending:true}).limit(300)
  ]);
  S.exp=q[6]&&!q[6].error?(q[6].data||[]):null;
  S.tasks=q[4].error?null:(q[4].data||[]);
  S.reqs=q[5].error?null:(q[5].data||[]);
  S.shifts=q[3].error?null:(q[3].data||[]);
  S.me=q[0].data||null;S.cash=q[1].data||[];S.err=q[1].error?q[1].error.message:'';
  var c=q[2].data||{};S.cfg=c;S.purposes=Array.isArray(c.cash_purposes)&&c.cash_purposes.length?c.cash_purposes:['Закупка материалов','Командировка','Топливо','Зарплата / аванс','Прочее'];S.hours=+c.cash_confirm_hours||24;
  S.bal=null;S.people=[];
  if(S.me&&S.me.is_cashier&&S.me.status==='approved'){
    var pr=await sb.rpc('cash_pin_state');S.pin=pr.error?{set:false,unlocked:false}:pr.data;
    if(S.pin.unlocked){var r=await Promise.all([sb.rpc('cash_balance'),sb.rpc('cash_people')]);
    S.bal=r[0].error?null:Number(r[0].data);S.people=Array.isArray(r[1].data)?r[1].data:[]}
  }
  S.loaded=true;render();
}

function header(){return '<header><b>'+(S.me&&S.me.is_cashier?'Arev Касса':'Arev')+'</b>'+(S.me?'<span>'+hu(S.me.name)+'</span>':'')+'<span class="sp"></span><button data-a="lang" data-v="'+(window.ARLANG==='hy'?'ru':'hy')+'">'+(window.ARLANG==='hy'?'Русский':'Հայերեն')+'</button>'+(S.sess?'<button data-a="reload">Обновить</button><button data-a="logout">Выйти</button>':'')+'</header>'}

function loginView(){
  var reg=!!S.reg;
  return header()+'<div class="login"><div class="card"><h2>'+(reg?'Регистрация сотрудника':'Вход')+'</h2><p class="muted small">'+(reg?'Для офисных сотрудников. Придумайте PIN-код (минимум 6 цифр): им вы будете входить сюда и в приложение. После регистрации руководитель подтвердит анкету.':'Тот же номер телефона и PIN-код, что в приложении Arev Service.')+'</p>'+
  (reg?'<div class="field"><label for="nm">Имя и фамилия</label><input id="nm" data-f="nm" autocomplete="name" value="'+h(S.form.nm||'')+'"></div>':'')+
  '<div class="field" style="margin-top:10px"><label for="ph">Телефон</label><input id="ph" data-f="ph" type="tel" inputmode="tel" autocomplete="off" placeholder="+374 91 123456" value="'+h(S.form.ph||'')+'"></div>'+
  '<div class="field" style="margin-top:10px"><label for="pin">PIN-код</label><input id="pin" data-f="pin" type="password" inputmode="numeric" autocomplete="new-password" value="'+h(S.form.pin||'')+'"></div>'+
  (reg?'<p class="muted small" style="margin-top:10px">Нажимая «Зарегистрироваться», вы соглашаетесь, что время прихода и ухода записывается и видно руководителю.</p>':'')+
  '<button class="p" style="width:100%;margin-top:14px" data-a="'+(reg?'register':'login')+'"'+(S.busy?' disabled':'')+'>'+(reg?'Зарегистрироваться':'Войти')+'</button>'+
  '<p style="text-align:center;margin:14px 0 0"><a href="#" data-a="regmode" data-v="'+(reg?'0':'1')+'" class="small">'+(reg?'У меня уже есть аккаунт — войти':'Нет аккаунта? Зарегистрироваться')+'</a></p></div></div>'}

function recvBlock(){
  var mine=S.cash.filter(function(x){return x.kind==='issue'&&x.staff_id===S.me.id&&x.status==='pending'&&!x.voided_at});
  if(!mine.length)return '';
  return '<section class="card"><h2>Вам выдали деньги: подтвердите получение</h2><div style="display:flex;flex-direction:column;gap:10px">'+mine.map(function(x){
    var dsp=S.dispute===x.id;
    return '<div class="recv"><div class="amt">'+money(x.amount)+'</div><div>'+hu(puT(x.purpose||''))+(x.note?' · '+h(x.note):'')+'</div><div class="small muted">Выдал(а): '+hu(x.by_name||'—')+' · '+fT(ms(x.at))+'</div>'+
    (dsp?'<div class="field"><label>Что не так? (например, получили другую сумму)</label><input data-f="dn" value="'+h(S.form.dn||'')+'" placeholder="Получил 8000"></div><div class="row"><button class="bad" data-a="disp" data-id="'+h(x.id)+'">Отправить</button><button data-a="dispno">Назад</button></div>'
         :'<div class="row"><button class="ok" data-a="conf" data-id="'+h(x.id)+'">Получил</button><button data-a="dispopen" data-id="'+h(x.id)+'">Не получил / другая сумма</button></div>')+'</div>'}).join('')+'</div></section>'}

function issueForm(){
  var f=S.form;
  if(S.step){var p=S.step.staff?(S.people.find(function(x){return x.id===S.step.staff})||{}):{name:'Офис'};
    return '<section class="card"><h2>Проверьте выдачу</h2><p class="muted small" style="margin:0 0 8px">Выдача уйдёт директору на подтверждение.</p><p style="font-size:18px;margin:0 0 6px"><b>'+money(S.step.amount)+'</b> → '+hu(p.name||'')+'</p><p class="muted" style="margin:0 0 12px">'+hu(puT(S.step.purpose))+(S.step.note?' · '+S.step.note:'')+'</p><div class="row"><button class="out" data-a="issueok"'+(S.busy?' disabled':'')+'>Отправить директору</button><button data-a="issueback">Изменить</button></div></section>'}
  return '<section class="card"><h2 class="hh"><span class="hic o"><img src="../icons/cash-out.png" alt=""></span><span>Выдать наличные</span></h2><p class="muted small" style="margin:0 0 10px">Любая выдача сначала подтверждается директором. После одобрения она появится выше в блоке «К выдаче».</p><div class="row" style="align-items:flex-end">'+
   '<div class="field"><label for="i-s">Кому</label><select id="i-s" data-f="is"><option value="">— выберите —</option><option value="__office"'+(f.is==='__office'?' selected':'')+'>Офис</option>'+S.people.map(function(x){return '<option value="'+h(x.id)+'"'+(f.is===x.id?' selected':'')+'>'+h(x.name)+'</option>'}).join('')+'</select></div>'+
   '<div class="field"><label for="i-a">Сумма, ֏</label><input id="i-a" data-f="ia" inputmode="numeric" placeholder="50000" value="'+h(f.ia||'')+'"></div>'+
   '<div class="field" style="flex:2;min-width:240px"><label for="i-p">За что выданы деньги</label><input id="i-p" data-f="ip" maxlength="200" placeholder="впишите вручную" value="'+h(f.ip||'')+'"></div>'+
   '<button class="out" data-a="issue"><img class="bi" src="../icons/cash-out.png" alt=""><span>Запросить выдачу</span></button></div></section>'}

function topupForm(){
  var f=S.form;
  return '<section class="card"><h2 class="hh"><span class="hic i"><img src="../icons/cash-in.png" alt=""></span><span>Приход денег в кассу</span></h2><div class="row" style="align-items:flex-end">'+
   '<div class="field"><label for="t-a">Сумма, ֏</label><input id="t-a" data-f="ta" inputmode="numeric" placeholder="100000" value="'+h(f.ta||'')+'"></div>'+
   '<div class="field" style="flex:2;min-width:240px"><label for="t-n">Откуда деньги</label><input id="t-n" data-f="tn" maxlength="300" placeholder="впишите вручную" value="'+h(f.tn||'')+'"></div>'+
   '<button class="in" data-a="topup"'+(S.busy?' disabled':'')+'><img class="bi" src="../icons/cash-in.png" alt=""><span>Принять в кассу</span></button></div></section>'}

function ledger(){
  var from=perFrom(S.flt.per);
  var rows=S.cash.filter(function(x){var t=ms(x.at);if(t<from||t>=perTo())return false;if(S.flt.who&&x.staff_id!==S.flt.who)return false;
    if(S.flt.st==='pending')return x.kind==='issue'&&x.status==='pending'&&!x.voided_at;if(S.flt.st==='disputed')return x.status==='disputed'&&!x.voided_at;if(S.flt.st==='void')return !!x.voided_at;return true});
  var live=rows.filter(function(x){return !x.voided_at});
  var out=live.filter(function(x){return x.kind==='issue'}).reduce(function(a,x){return a+x.amount},0),inn=live.filter(function(x){return x.kind==='topup'}).reduce(function(a,x){return a+x.amount},0);
  var names={};S.cash.forEach(function(x){if(x.staff_id)names[x.staff_id]=x.staff_name||'—'});

    S.registering=true;
    var r=await sb.auth.signUp({email:ph+'@'+DOMAIN,password:S.form.pin});
    if(r.error){S.registering=false;return toast(/already|registered/i.test(r.error.message)?'Этот номер уже зарегистрирован. Нажмите «У меня уже есть аккаунт» и войдите.':'Ошибка: '+r.error.message)}
    if(!r.data.session){S.registering=false;S.reg=false;return toast('Аккаунт создан. Войдите с этим номером и PIN-кодом.')}
    var q=await sb.rpc('register',{p_name:nm,p_phone:'+'+ph,p_car_model:'',p_car_plate:'',p_fuel_type:'petrol',p_norm:null,p_tank:null,p_device:null});
    S.registering=false;
    if(q.error)return toast('Ошибка: '+q.error.message);
    toast('Анкета отправлена. Руководитель её подтвердит.');S.reg=false;await load()})},
  login:function(){return run(async function(){
    var ph=normPhone(S.form.ph);if(ph.length<11)return toast('Введите номер полностью, например +374 91 123456');
    if(!/^\d{6,}$/.test(S.form.pin||''))return toast('PIN-код — минимум 6 цифр');
    var r=await sb.auth.signInWithPassword({email:ph+'@'+DOMAIN,password:S.form.pin});
    if(r.error)return toast(/Invalid login/i.test(r.error.message)?'Неверный номер или PIN-код':'Ошибка: '+r.error.message);
  })},
  conf:function(d){return run(async function(){var r=await sb.rpc('cash_confirm',{p_id:d.id,p_ok:true,p_note:null,p_device:'web'});var e=errOf(r);if(e)return toast(e);toast('Получение подтверждено');await load()})},
  dispopen:function(d){S.dispute=d.id;S.form.dn='';render()},
  dispno:function(){S.dispute=null;render()},
  disp:function(d){return run(async function(){var r=await sb.rpc('cash_confirm',{p_id:d.id,p_ok:false,p_note:S.form.dn||'',p_device:'web'});var e=errOf(r);if(e)return toast(e);S.dispute=null;toast('Администратор увидит ваше замечание');await load()})},
  issue:function(){var f=S.form,a=parseInt(String(f.ia||'').replace(/\D/g,''),10);
    if(!f.is)return toast('Выберите получателя или «Офис»');if(!a)return toast('Введите сумму');if(!String(f.ip||'').trim())return toast('Впишите, за что выданы деньги');
    S.step={staff:f.is==='__office'?null:f.is,amount:a,purpose:String(f.ip).trim(),note:''};render()},
  topup:function(){return run(async function(){var f=S.form,a=parseInt(String(f.ta||'').replace(/\D/g,''),10);
    if(!a)return toast('Введите сумму');if(!String(f.tn||'').trim())return toast('Впишите, откуда деньги');
    if(!confirm(puT('Внести в кассу')+': '+money(a)+'?'))return;
    var r=await sb.rpc('cash_topup',{p_amount:a,p_note:String(f.tn).trim(),p_device:'web'});var e=errOf(r);if(e)return toast(e);
    S.form.ta='';S.form.tn='';toast('Приход записан');await load()})},
  backadd:function(){return run(async function(){var f=S.form,a=parseInt(String(f.ba||'').replace(/\D/g,''),10);
    if(!a)return toast('Введите сумму');if(!String(f.bp||'').trim())return toast('Впишите, на что или откуда');
    var r=await sb.rpc('cash_backfill',{p_kind:f.bk||'issue',p_amount:a,p_date:f.bd||(S.cfg||{}).cash_backfill_from,p_purpose:String(f.bp).trim(),p_who:String(f.bw||'').trim()||null,p_device:'web'});var e=errOf(r);if(e)return toast(e);
    S.form.ba='';S.form.bp='';S.form.bw='';toast('Запись внесена');await load()})},
  expadd:function(){return run(async function(){var f=S.form,a=parseInt(String(f.xa||'').replace(/\D/g,''),10);
    if(!a)return toast('Введите сумму');if(!String(f.xs||'').trim())return toast('Впишите, откуда деньги');
    var r=await sb.rpc('exp_add',{p_kind:f.xk||'cash',p_amount:a,p_source:String(f.xs).trim(),p_due:f.xd||null,p_device:'web'});var e=errOf(r);if(e)return toast(e);
    S.form.xa='';S.form.xs='';S.form.xd='';toast('Ожидаемый приход добавлен');await load()})},
  expok:function(d){return run(async function(){var x=(S.exp||[]).find(function(y){return y.id===d.id});if(!x)return;
    var v=prompt(puT(x.kind==='cash'?'Сколько получено наличными? Эта сумма будет внесена в кассу. Если пришла только часть — впишите её, остаток останется в ожидаемых.':'Сколько пришло на банк? Если пришла только часть — впишите её, остаток останется в ожидаемых.'),String(x.amount));
    if(v==null)return;var a=parseInt(String(v).replace(/\D/g,''),10);if(!a||a>x.amount)return toast('Введите сумму не больше ожидаемой');
    var r=await sb.rpc('exp_close',{p_id:d.id,p_received:true,p_device:'web',p_amount:a});var e=errOf(r);if(e)return toast(e);
    toast(a<x.amount?'Часть получена, остаток ждём':(x.kind==='cash'?'Приход записан':'Отмечено: получено'));await load()})},
  expno:function(d){return run(async function(){if(!confirm(puT('Убрать этот ожидаемый приход?')))return;
    var r=await sb.rpc('exp_close',{p_id:d.id,p_received:false,p_device:'web'});var e=errOf(r);if(e)return toast(e);await load()})},
  issueback:function(){S.step=null;render()},
  issueok:function(){return run(async function(){var st=S.step;var r=await sb.rpc('req_cashier_create',{p_staff:st.staff,p_amount:st.amount,p_purpose:st.purpose,p_note:st.note||null,p_device:'web'});var e=errOf(r);if(e)return toast(e);
    S.step=null;S.form.ia='';S.form.is='';S.form.ip='';S.form.in='';toast('Отправлено директору. Выдать можно после его одобрения.');await load()})},
  voidopen:function(d){S.voidId=d.id;S.form.vr='';render()},
  voidno:function(){S.voidId=null;render()},
  voidok:function(d){return run(async function(){if(!String(S.form.vr||'').trim())return toast('Впишите причину');var r=await sb.rpc('cash_void',{p_id:d.id,p_reason:S.form.vr});var e=errOf(r);if(e)return toast(e);S.voidId=null;toast('Выдача отменена');await load()})},
  csv:function(){
    var from=perFrom(S.flt.per);var to=perTo();var rows=S.cash.filter(function(x){return ms(x.at)>=from&&ms(x.at)<to&&(!S.flt.who||x.staff_id===S.flt.who)});
    var q=function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'};
    var out=['Дата;Тип;Кому;Сумма;Цель;Комментарий;Кто внёс;Статус;Подтверждено;Отменено'];
    rows.forEach(function(x){var d=new Date(x.at);var st=x.voided_at?'отменено':x.kind==='topup'?'пополнение':x.status==='confirmed'?'получено':x.status==='disputed'?'оспорено':'ждёт подтверждения';
      out.push([d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+p2(d.getHours())+':'+p2(d.getMinutes()),x.kind==='topup'?'пополнение':'выдача',x.staff_name||'',(x.kind==='topup'?'':'-')+x.amount,x.purpose||'',x.note||'',x.by_name||'',st,x.confirmed_at?new Date(x.confirmed_at).toLocaleString('ru-RU'):'',x.voided_at?(x.void_by+': '+x.void_reason):''].map(q).join(';'))});
    var lv=rows.filter(function(x){return !x.voided_at});var tOut=lv.filter(function(x){return x.kind==='issue'}).reduce(function(m,x){return m+x.amount},0),tIn=lv.filter(function(x){return x.kind==='topup'}).reduce(function(m,x){return m+x.amount},0);
    out.push('');out.push(['','','Итого выдано',tOut].join(';'));out.push(['','','Итого пополнено',tIn].join(';'));out.push(['','','Разница за период',tIn-tOut].join(';'));
    var blob=new Blob(['﻿'+out.join('\r\n')],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kassa-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
};

document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-vp]');if(!b)return;var a=b.nextElementSibling;if(!a||a.tagName!=='AUDIO')return;var lab=b.querySelector('span');
  if(!a.paused){a.pause();return}
  document.querySelectorAll('audio').forEach(function(x){if(x!==a&&!x.paused)x.pause()});
  a.onended=a.onpause=function(){if(lab)lab.textContent='Слушать'};a.play().then(function(){if(lab)lab.textContent='Пауза'}).catch(function(){toast('Не удалось воспроизвести')})});
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;if(b.tagName==='A')e.preventDefault();var f=A[b.dataset.a];if(f)f({id:b.dataset.id,v:b.dataset.v})});
document.addEventListener('input',function(e){var el=e.target;if(el.dataset.f)S.form[el.dataset.f]=el.value});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset.fl){S.flt[el.dataset.fl]=el.value;render()}else if(el.dataset.f&&el.tagName==='SELECT'){S.form[el.dataset.f]=el.value}});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||e.isComposing||!e.target||!e.target.dataset||!e.target.dataset.f||S.busy)return;
  var f=e.target.dataset.f,go=null;
  if(!S.sess){if(f==='pin'||f==='ph'||f==='nm')go=S.reg?'register':'login'}
  else if(f==='k0')go='pinunlock';
  else if(f==='k1'||f==='k2')go='pinset';
  else if(f==='tt'||f==='td')go='taskadd';
  else if(f==='tdn'&&S.doneId)go='taskdone';
  else if(f==='tsay'&&S.openT)go='tasksay';
  else if(f==='ia'||f==='ip'||f==='in'||f==='is')go='issue';
  else if(f==='ta'||f==='tn')go='topup';
  else if(f==='xa'||f==='xs')go='expadd';
  else if(f==='rq_a'||f==='rq_p'||f==='rq_n')go='reqsend';
  else if(f==='rq_say'&&S.reqOpen)go='reqsay';
  else if(f==='rq_fw'&&S.fwId)go='reqforward';
  if(!go||!A[go])return;
  e.preventDefault();
  var d={id:go==='taskdone'?S.doneId:go==='tasksay'?S.openT:go==='reqsay'?S.reqOpen:go==='reqforward'?S.fwId:undefined};
  A[go](d);
});

function onSession(s){S.sess=s;S.loaded=false;S.me=null;if(s){if(!S.registering)load();else render()}else render()}

async function doLock(){try{await sb.rpc('cash_lock')}catch(_){}if(S.pin){S.pin.unlocked=false}S.bal=null;S.people=[];render()}
['click','keydown','mousemove','touchstart','scroll'].forEach(function(ev){document.addEventListener(ev,function(){S.last=Date.now()},{passive:true})});
setInterval(function(){if(S.sess&&S.pin&&S.pin.unlocked&&Date.now()-S.last>10*60*1000){doLock();toast('Касса заблокирована: 10 минут без действий')}},15000);
sb.auth.getSession().then(function(r){onSession(r.data.session||null)});
sb.auth.onAuthStateChange(function(ev,s){if(ev==='SIGNED_IN'&&!S.sess)onSession(s);if(ev==='SIGNED_OUT')onSession(null)});
var seenN={},baseT=document.title,newCnt=0;
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=0.08;o.start();setTimeout(function(){o.stop();c.close()},250)}catch(e){}}
async function pollNew(){
  if(!S.sess||!S.me||S.me.kind!=='office'||S.me.status!=='approved')return;
  var since=new Date(Date.now()-3*60000).toISOString(),u=S.sess.user.id;
  var q=await Promise.all([
    sb.from('tasks').select('id,title,created_at,by_self').or('staff_id.eq.'+u+',staff2_id.eq.'+u).eq('status','new').gt('created_at',since),
    sb.from('task_log').select('id,kind,body,at').eq('actor_role','admin').in('kind',['text','file','voice','photo']).gt('at',since),
    sb.from('cash_requests').select('id,status,requester_name,amount_asked,amount_approved,created_at,forwarded_at,decided_at,paid_at').or('created_at.gt.'+since+',forwarded_at.gt.'+since+',decided_at.gt.'+since+',paid_at.gt.'+since)]);
  var items=[];
  (q[0].data||[]).forEach(function(x){if(!x.by_self&&!seenN['t'+x.id]){seenN['t'+x.id]=1;items.push('Новая задача: '+x.title)}});
  (q[1].data||[]).forEach(function(x){if(!seenN['l'+x.id]){seenN['l'+x.id]=1;items.push('Сообщение от руководителя'+(x.body?': '+x.body:''))}});
  var cs=!!S.me.is_cashier;
  (q[2].data||[]).forEach(function(x){
    var k='r'+x.id+x.status;if(seenN[k])return;seenN[k]=1;
    if(cs){
      if(x.status==='new')items.push('Новый запрос денег: '+x.requester_name+', '+money(x.amount_asked));
      else if(x.status==='approved')items.push('К выдаче: '+x.requester_name+', '+money(x.amount_approved));
      else if(x.status==='waiting')items.push('Директор просит подождать: '+x.requester_name);
      else if(x.status==='rejected')items.push('Запрос отклонён: '+x.requester_name);
    }else{
      if(x.status==='forwarded')items.push('Ваш запрос передан директору');
      else if(x.status==='approved')items.push('Запрос одобрен: '+money(x.amount_approved));
      else if(x.status==='waiting')items.push('По запросу: подождите');
      else if(x.status==='rejected')items.push('Запрос отклонён');
      else if(x.status==='paid')items.push('Деньги выданы, подтвердите получение');
    }});
  if(S.pollInit!==true){S.pollInit=true;return}
  if(!items.length)return;
  newCnt+=items.length;document.title='('+newCnt+') '+baseT;beep();toast(items[0]);
  try{if(window.Notification&&Notification.permission==='granted')new Notification('Arev',{body:items.join('\n')})}catch(e){}
  if(!document.activeElement.matches('input,select'))load();
}
window.addEventListener('focus',function(){newCnt=0;document.title=baseT});
setInterval(pollNew,45000);
setInterval(function(){if(S.sess&&S.loaded&&!S.step&&!S.dispute&&!S.voidId&&document.visibilityState==='visible'&&!document.activeElement.matches('input,select'))load()},60000);
render();
})();
</script>
